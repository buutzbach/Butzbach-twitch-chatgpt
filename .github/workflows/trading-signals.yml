name: Trading signals

on:
  schedule:
    - cron: '30 17 * * 1-5' # weekdays 17:30 UTC, after European market close
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Space-separated symbols'
        default: 'AAPL SAP.DE IWDA.AS'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send signals to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOLS: ${{ inputs.symbols || vars.SYMBOLS || 'AAPL SAP.DE IWDA.AS' }}
        run: node trading-bot/index.js notify $SYMBOLS
